name: Gluttonous Flies acceptance

on:
  push:
    branches:
      - production/batch-the-gluttonous-flies-0012-0013
    paths:
      - .github/triggers/gluttonous-flies-ready

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize reviewed title-family inputs
        run: |
          python tools/materialize_chapter12_inputs.py
          python tools/materialize_chapter13_inputs.py
          for n in 12 13; do
            python tools/build_editorial_draft.py "$n"
            python tools/build_chapter_preview.py "$n"
          done
          python tools/rebuild_editorial_tracking.py

      - name: Pre-acceptance complete repository checks
        run: |
          python tools/verify_recovery.py
          for n in $(seq 1 13); do
            python tools/build_editorial_draft.py "$n" --check
            python tools/build_chapter_preview.py "$n" --check
          done
          python tools/rebuild_editorial_tracking.py --check
          python -m unittest discover -s tests -v
          git diff --check

      - name: Install Playwright Python package only
        run: python -m pip install --disable-pip-version-check playwright

      - name: Render both chapters with preinstalled Chrome
        run: python tools/render_gluttonous_flies_layout.py

      - name: Finalize title-family acceptance records
        run: |
          python tools/finalize_gluttonous_flies_batch.py
          python tools/rebuild_editorial_tracking.py

      - name: Final accepted-state checks
        run: |
          python tools/verify_recovery.py
          for n in $(seq 1 13); do
            python tools/build_editorial_draft.py "$n" --check
            python tools/build_chapter_preview.py "$n" --check
          done
          python tools/rebuild_editorial_tracking.py --check
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit accepted Gluttonous Flies family
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Accept Gluttonous Flies title-family reconstruction [skip ci]"
          git push
