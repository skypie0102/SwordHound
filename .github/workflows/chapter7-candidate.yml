name: Chapter 7 candidate

on:
  push:
    branches:
      - production/chapter-0007
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/chapter-0007
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and validate
        run: |
          python tools/materialize_chapter_0007.py
          python tools/rebuild_editorial_tracking.py
          python tools/verify_recovery.py
          python tools/build_editorial_draft.py 7 --check
          python tools/build_chapter_preview.py 7 --check
          python tools/rebuild_editorial_tracking.py --check
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit candidate outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/edits/chapter-0007.json editorial/korean-alignment/chapter-0007.json editorial/provenance/chapter-0007.json editorial/chapter-tracker.json manuscript/drafts/chapter-0007.md preview/chapter-0007.html
          git commit -m "Materialize Chapter 7 candidate [skip ci]"
          git push origin HEAD:production/chapter-0007
