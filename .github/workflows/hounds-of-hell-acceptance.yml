name: Hounds of Hell acceptance

on:
  push:
    branches:
      - production/batch-hounds-of-hell-0008-0011
    paths:
      - .github/triggers/hounds-of-hell-ready

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize reviewed family inputs
        run: |
          python tools/materialize_chapter8_inputs.py
          python tools/materialize_chapter9_inputs.py
          python tools/materialize_chapter10_inputs.py
          python tools/materialize_chapter11_inputs.py
          for n in 8 9 10 11; do
            python tools/build_editorial_draft.py "$n"
            python tools/build_chapter_preview.py "$n"
          done
          python tools/rebuild_editorial_tracking.py

      - name: Pre-acceptance repository checks
        run: |
          python tools/verify_recovery.py
          for n in 8 9 10 11; do
            python tools/build_editorial_draft.py "$n" --check
            python tools/build_chapter_preview.py "$n" --check
          done
          python tools/rebuild_editorial_tracking.py --check
          python -m unittest discover -s tests -v
          git diff --check

      - name: Install browser tooling once for the family
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Render all family layout evidence
        run: python tools/render_hounds_of_hell_layout.py

      - name: Finalize family acceptance records
        run: |
          python tools/finalize_hounds_of_hell_batch.py
          python tools/rebuild_editorial_tracking.py

      - name: Final accepted-state checks
        run: |
          python tools/verify_recovery.py
          for n in $(seq 1 11); do
            python tools/build_editorial_draft.py "$n" --check
            python tools/build_chapter_preview.py "$n" --check
          done
          python tools/rebuild_editorial_tracking.py --check
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit accepted Hounds of Hell family
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Accept Hounds of Hell title-family reconstruction [skip ci]"
          git push
