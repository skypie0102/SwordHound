name: Chapter 6 acceptance

on:
  push:
    branches:
      - production/chapter-0006
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/chapter-0006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Apply final prose corrections
        run: python tools/prepare_chapter_0006_final.py
      - name: Render final layout evidence
        run: python tools/inspect_chapter_0006.py
      - name: Pre-acceptance checks
        run: |
          python tools/verify_recovery.py
          python tools/build_editorial_draft.py 6 --check
          python tools/build_chapter_preview.py 6 --check
          python tools/rebuild_editorial_tracking.py --check
          python -m unittest discover -s tests -v
          git diff --check
      - name: Generate acceptance evidence
        run: python tools/finalize_chapter_0006.py
      - name: Regenerate accepted tracker
        run: python tools/rebuild_editorial_tracking.py
      - name: Final accepted-state checks
        run: |
          python tools/verify_recovery.py
          python tools/build_editorial_draft.py 6 --check
          python tools/build_chapter_preview.py 6 --check
          python tools/rebuild_editorial_tracking.py --check
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit accepted Chapter 6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATE.md PROGRESS.md editorial manuscript preview qa
          git commit -m "Accept Chapter 6 reconstruction [skip ci]"
          git push origin HEAD:production/chapter-0006
