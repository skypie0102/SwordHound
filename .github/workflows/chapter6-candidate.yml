name: Chapter 6 candidate render

on:
  push:
    branches:
      - production/chapter-0006
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/chapter-0006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Materialize Chapter 6
        run: |
          python tools/materialize_chapter_0006.py
          python tools/rebuild_editorial_tracking.py
      - name: Validate candidate
        run: |
          python tools/verify_recovery.py
          python tools/build_editorial_draft.py 6 --check
          python tools/build_chapter_preview.py 6 --check
          python tools/rebuild_editorial_tracking.py --check
          python -m unittest discover -s tests -v
          git diff --check
      - name: Inspect layout
        run: python tools/inspect_chapter_0006.py
      - name: Commit candidate outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/edits/chapter-0006.json editorial/korean-alignment/chapter-0006.json editorial/provenance/chapter-0006.json editorial/chapter-tracker.json manuscript/drafts/chapter-0006.md preview/chapter-0006.html qa/layout/chapter-0006.json qa/layout/chapter-0006-*.png
          git commit -m "Materialize Chapter 6 candidate [skip ci]"
          git push origin HEAD:production/chapter-0006
