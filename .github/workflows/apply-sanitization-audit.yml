name: One-shot sanitization reacceptance

on:
  push:
    branches:
      - audit/sanitization-ch1-13
    paths:
      - .github/workflows/apply-sanitization-audit.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/apply-sanitization-audit.yml

permissions:
  contents: write

jobs:
  reaccept:
    if: github.head_ref == 'audit/sanitization-ch1-13' || github.ref_name == 'audit/sanitization-ch1-13'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/sanitization-ch1-13
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reopen affected accepted chapters
        run: |
          python -m tools.apply_sanitization_audit_v2 reopen
          git add editorial/reconstruction-status.json \
            qa/chapter-0001.json qa/chapter-0002.json qa/chapter-0008.json \
            qa/chapter-0010.json qa/chapter-0011.json qa/chapter-0013.json
          git commit -m "qa: reopen sanitized accepted chapters"

      - name: Apply corrections, regenerate, and re-accept
        run: python -m tools.apply_sanitization_audit_v2 apply

      - name: Run deterministic editorial QA
        run: |
          python tools/verify_recovery.py
          for chapter in 1 2 8 10 11 13; do
            python tools/build_editorial_draft.py "$chapter" --check
          done
          python tools/rebuild_editorial_tracking.py --check
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit accepted regenerated state
        run: |
          git add AGENTS.md PROGRESS.md editorial qa manuscript tools preview
          git commit -m "fix: restore unsanitized chapter fidelity and reaccept"
          git push origin HEAD:audit/sanitization-ch1-13
